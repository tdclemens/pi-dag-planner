name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  release:
    name: Release
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sign the version-bump commit with the GitHub Actions bot key.
      # The repository ruleset requires verified commit signatures; a commit
      # signed with the bot key (and pushed with GITHUB_TOKEN) is marked
      # "Verified" on GitHub.
      - name: Configure git signing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign true
          git config tag.gpgsign true
          git config gpg.format ssh
          mkdir -p ~/.ssh
          echo "$SSH_GPG_KEY" | base64 --decode > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keygen -y -f ~/.ssh/id > ~/.ssh/id.pub
          git config user.signingkey $HOME/.ssh/id.pub

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
